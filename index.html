<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Scroll-Reactive Music</title>
  <style>
    body {
      height: 5000px;
      margin: 0;
      font-family: sans-serif;
      background: linear-gradient(to bottom, #000428, #004e92);
      color: white;
      padding: 50px;
    }

    h1 {
      font-size: 3em;
    }

    p {
      font-size: 1.2em;
    }

    .instructions {
      position: fixed;
      top: 20px;
      left: 20px;
      background: rgba(0,0,0,0.5);
      padding: 1em;
      border-radius: 8px;
    }
  </style>
</head>
<body>

  <div class="instructions">
    <h1>🎵 Scroll to Control Music</h1>
    <p>Start scrolling to hear music. Scroll faster to increase volume!</p>
  </div>

  <audio id="scrollMusic" loop>
    <source src="OpeningTitles.mp3.mp3" type="audio/mpeg">
    Your browser does not support the audio element.
  </audio>

  <script>
    const audio = document.getElementById('scrollMusic');
    let lastScrollTop = 0;

    window.addEventListener('scroll', () => {
      const scrollTop = window.scrollY;
      const scrollSpeed = Math.abs(scrollTop - lastScrollTop);
      lastScrollTop = scrollTop;

      if (audio.paused) {
        audio.play().catch(e => console.log("Autoplay error:", e));
      }

      // Normalize scrollSpeed to a volume range between 0 and 1
      const volume = Math.min(1, scrollSpeed / 50);
      audio.volume = volume;
    });
  </script>

</body>
</html>
