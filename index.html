    body {

      padding: 50px;
    }

    h1 {
      font-size: 3em;
    }

      background: rgba(0,0,0,0.5);

      border-radius: 8px;
    }
  </style>
</head>
<body>

  <div class="instructions">
    <h1>🎵 Scroll to Control Music</h1>
    <p>Start scrolling to hear music. Scroll faster to increase volume!</p>
  </div>
